<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot MapReduce · Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101013;
    --panel: rgba(24, 24, 29, .92);
    --line: rgba(255,255,255,.09);
    --txt: #e8e8ee;
    --dim: #8b8b99;
    --purple: #a78bfa;
    --blue: #6b9bff;
    --cyan: #22d3ee;
    --red: #ff6b6b;
    --amber: #fbbf24;
    --green: #4ade80;
    --gray: #9aa0b4;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c3a2e;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--txt); }
  body { padding: 10px; background: radial-gradient(1200px 700px at 10% 0%, #2d5a6b, transparent 60%),
                                    radial-gradient(1000px 700px at 100% 100%, #3d7a3a, transparent 55%), #1c3a2e; }

  #viewport { position: relative; width: 100%; height: 100%; border-radius: 10px; overflow: hidden;
    background-color: var(--bg); cursor: grab; border: 1px solid rgba(255,255,255,.12);
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; width: 1800px; height: 880px; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; width: 1800px; height: 880px; overflow: visible; pointer-events: none; }

  /* ── floating panels ── */
  .panel { position: absolute; z-index: 20; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; backdrop-filter: blur(8px); box-shadow: 0 6px 22px rgba(0,0,0,.35); }
  #p-brand { top: 14px; left: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  #p-brand b { font-size: 15px; letter-spacing: .1px; }
  #p-job { top: 14px; left: 50%; transform: translateX(-50%); padding: 9px 18px; min-width: 330px; }
  #p-actions { top: 14px; right: 14px; padding: 8px; display: flex; align-items: center; gap: 8px; }
  .lbl { font-size: 10px; letter-spacing: 1.4px; color: var(--dim); font-weight: 600; text-transform: uppercase; }
  .job-top { display: flex; align-items: baseline; gap: 12px; }
  .job-pct { font-family: var(--mono); font-size: 26px; font-weight: 700; line-height: 1.05; }
  .job-state { font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 2px 8px; border-radius: 99px;
    background: rgba(255,255,255,.07); color: var(--gray); }
  .job-state.running { color: var(--blue); background: rgba(107,155,255,.14); }
  .job-state.done { color: var(--green); background: rgba(74,222,128,.14); }
  .job-state.failed { color: var(--red); background: rgba(255,107,107,.14); }
  .job-track { height: 5px; border-radius: 4px; background: rgba(255,255,255,.08); margin-top: 7px; overflow: hidden; }
  .job-track i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--cyan)); transition: width .6s ease; }
  .job-sub { margin-top: 6px; font-size: 10.5px; color: var(--dim); display: flex; justify-content: space-between; gap: 18px; }

  button.btn { font: 600 12.5px 'Inter', sans-serif; color: var(--txt); background: rgba(255,255,255,.05);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 7px; transition: background .15s, border-color .15s, transform .05s; }
  button.btn:hover { background: rgba(255,255,255,.11); }
  button.btn:active { transform: translateY(1px); }
  button.btn.go { border-color: rgba(74,222,128,.45); color: var(--green); }
  button.btn.warn { border-color: rgba(251,191,36,.45); color: var(--amber); }
  button.btn.bad { border-color: rgba(255,107,107,.5); color: var(--red); }
  button.icon { width: 36px; height: 36px; padding: 0; justify-content: center; }
  .target-chip { font: 600 11px var(--mono); color: var(--dim); padding: 0 6px; white-space: nowrap; }
  .target-chip b { color: var(--txt); }
  a.btn { text-decoration: none; color: var(--txt); }

  #p-hint { top: 78px; left: 50%; transform: translateX(-50%); padding: 7px 16px; border-radius: 10px;
    font-size: 10.5px; letter-spacing: 1.3px; color: var(--dim); font-weight: 600; white-space: nowrap; }
  #p-hint span + span::before { content: '·'; margin: 0 10px; color: #555; }
  #p-side { top: 78px; left: 14px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; }
  #p-events { top: 126px; left: 14px; width: 360px; max-height: calc(100% - 210px); overflow: hidden; display: none; padding: 10px 12px; }
  #p-events.open { display: block; }
  #ev-list { overflow-y: auto; max-height: calc(100vh - 290px); margin-top: 8px; }
  .ev { display: grid; grid-template-columns: 54px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 11px; line-height: 1.35; }
  .ev time { font-family: var(--mono); color: var(--dim); font-size: 10px; }
  .ev em { font-style: normal; font-weight: 700; font-size: 9.5px; letter-spacing: .6px; margin-right: 6px; color: var(--blue); }
  .ev.k-bad em { color: var(--red); } .ev.k-warn em { color: var(--amber); } .ev.k-ok em { color: var(--green); }

  #p-stats { bottom: 14px; left: 14px; padding: 9px 16px; font-size: 10.5px; letter-spacing: 1.2px; color: var(--dim); font-weight: 600; display: flex; gap: 14px; }
  #p-stats b { color: var(--txt); font-family: var(--mono); }
  #p-zoom { bottom: 14px; right: 14px; padding: 6px 10px; display: flex; align-items: center; gap: 14px; }
  #p-zoom button { background: none; border: 0; color: var(--txt); font-size: 18px; cursor: pointer; width: 28px; height: 28px; border-radius: 8px; }
  #p-zoom button:hover { background: rgba(255,255,255,.1); }
  #zoom-pct { font: 600 13px var(--mono); min-width: 44px; text-align: center; }

  /* ── nodes ── */
  .node { position: absolute; border-radius: 10px; border: 1.5px solid var(--nc); background: var(--nbg);
    box-shadow: 0 0 0 0 transparent; transition: box-shadow .25s, border-color .25s, opacity .3s, filter .3s; cursor: default; user-select: none; }
  .node.pickable { cursor: pointer; }
  .node.selected { box-shadow: 0 0 0 3px rgba(255,255,255,.55), 0 0 26px var(--nc); }
  .c-purple { --nc: var(--purple); --nbg: #1e1a33; }
  .c-gray   { --nc: #7f8db5;       --nbg: #181d2c; }
  .c-blue   { --nc: var(--blue);   --nbg: #151d36; }
  .c-cyan   { --nc: var(--cyan);   --nbg: #0b2430; }
  .c-red    { --nc: #ff7a7a;       --nbg: #2a1519; }
  .c-green  { --nc: var(--green);  --nbg: #12261b; }
  .n-head { display: flex; align-items: center; gap: 8px; padding: 7px 11px; font-size: 13px; font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,.1); }
  .n-head svg { width: 15px; height: 15px; stroke: var(--nc); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .n-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n-tag { font: 700 9px var(--mono); letter-spacing: .9px; padding: 2px 7px; border-radius: 99px; background: rgba(255,255,255,.08); color: var(--gray); white-space: nowrap; }
  .n-body { padding: 8px 11px 9px; }
  .m-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .m-big { font: 700 19px var(--mono); }
  .m-lbl { font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: var(--nc); margin-left: 6px; }
  .m-sub { font-size: 10.5px; color: var(--dim); margin-top: 2px; display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; }
  .m-sub .rt { font-family: var(--mono); }
  .spark { width: 84px; height: 22px; flex: none; }
  .spark polyline { fill: none; stroke: var(--nc); stroke-width: 1.5; stroke-linejoin: round; opacity: .9; }
  .bar { height: 3px; background: rgba(255,255,255,.1); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--nc); transition: width .5s ease; }
  .bar.indet i { width: 35% !important; animation: indet 1.1s ease-in-out infinite alternate; }
  @keyframes indet { from { margin-left: 0; } to { margin-left: 65%; } }

  /* worker status colouring (set via class on .node) */
  .node.st-idle  { --nc: #6f7aa0; }
  .node.st-spare { --nc: #8a7cff; }
  .node.st-busy  { --nc: var(--blue); }
  .node.st-drain { --nc: var(--amber); --nbg: #2b2412; animation: pulse 1s ease-in-out infinite; }
  .node.st-pre   { --nc: var(--amber); --nbg: #2b2412; opacity: .72; }
  .node.st-kill  { --nc: var(--red);   --nbg: #2c1418; opacity: .8; filter: saturate(1.1); }
  .node.st-respawn { --nc: var(--cyan); animation: pulse 1s ease-in-out infinite; }
  .node.st-online  { --nc: var(--green); --nbg: #12261b; }
  .node.st-done  { --nc: var(--green); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 22px var(--nc); } }
  .n-tag.t-bad { background: rgba(255,107,107,.18); color: var(--red); }
  .n-tag.t-warn { background: rgba(251,191,36,.18); color: var(--amber); }
  .n-tag.t-ok { background: rgba(74,222,128,.16); color: var(--green); }
  .n-tag.t-blue { background: rgba(107,155,255,.16); color: var(--blue); }
  .n-tag.t-cyan { background: rgba(34,211,238,.15); color: var(--cyan); }
  .resume-badge { display: none; margin-top: 5px; font: 700 9.5px var(--mono); color: var(--green); background: rgba(74,222,128,.12);
    border: 1px solid rgba(74,222,128,.35); padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  .resume-badge.show { display: inline-block; }

  /* rss / redis rows */
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 0 11px; border-top: 1px solid rgba(255,255,255,.07); }
  .row .l { min-width: 0; } .row .l b { font: 700 12px var(--mono); white-space: nowrap; }
  .row .l small { display: block; color: var(--dim); font-size: 9.5px; margin-top: 1px; }
  .row .r { text-align: right; font: 600 12px var(--mono); }
  .row .r small { display: block; color: var(--dim); font: 500 9.5px 'Inter', sans-serif; }
  .row .bar { grid-column: 1 / -1; margin: 0 0 6px; }
  .stat4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px; }
  .stat4 div { text-align: left; }
  .stat4 b { display: block; font: 700 15px var(--mono); }
  .stat4 span { font-size: 8.5px; letter-spacing: .9px; color: var(--dim); font-weight: 700; }

  /* edges */
  .edge { fill: none; stroke: rgba(160,170,200,.28); stroke-width: 1.5; }
  .edge.data { stroke: rgba(107,155,255,.35); }
  .edge.shuf { stroke: rgba(34,211,238,.38); }
  .edge.ckpt { stroke: rgba(251,191,36,.34); }
  .edge.lease { stroke: rgba(255,107,107,.32); stroke-dasharray: 5 5; }
  .edge.ctl  { stroke: rgba(160,170,200,.2); stroke-dasharray: 3 5; }
  .flow { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 2 14; opacity: 0; transition: opacity .3s; }
  .flow.on { opacity: 1; animation: dash 0.9s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -16; } }
  .flow.data { stroke: var(--blue); } .flow.shuf { stroke: var(--cyan); } .flow.ckpt { stroke: var(--amber); }
  .flow.out { stroke: var(--green); } .flow.ctl { stroke: #aab3d6; } .flow.lease { stroke: var(--red); }
  .edge.dead { stroke: rgba(255,107,107,.5); stroke-dasharray: 4 6; }
  .edge-lbl { fill: var(--dim); font: 600 10px 'Inter', sans-serif; letter-spacing: .6px; }

  /* group labels & sketch notes */
  .group { position: absolute; font-size: 10px; font-weight: 700; letter-spacing: 1.6px; color: #6a6a78; }
  .note { position: absolute; font-family: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive; font-size: 17px; line-height: 1.22; color: #d7d7e2; opacity: .92; }

  #toast { position: absolute; z-index: 50; left: 50%; bottom: 70px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: #23232b; border: 1px solid var(--line); padding: 9px 16px; border-radius: 10px; font-size: 12.5px; transition: all .25s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="viewport">

  <div id="world">
    <svg id="edges" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 1 L9 5 L0 9 z" fill="rgba(170,180,210,.55)"/>
        </marker>
      </defs>
      <g id="edge-layer"></g>
    </svg>
  </div>

  <!-- top-left brand -->
  <div class="panel" id="p-brand">
    <b>Spot MapReduce</b>
    <a class="btn icon" href="/ui" title="Classic dashboard" style="width:auto;padding:0 10px;height:30px;font-size:11px">Classic UI</a>
  </div>

  <!-- job progress (takes the place of the 'offered load' slider) -->
  <div class="panel" id="p-job">
    <div class="job-top">
      <div>
        <div class="lbl">Job progress</div>
        <div class="job-pct" id="job-pct">0%</div>
      </div>
      <span class="job-state" id="job-state">IDLE</span>
      <span style="flex:1"></span>
      <div style="text-align:right">
        <div class="lbl">Elapsed</div>
        <div class="job-pct" style="font-size:17px" id="job-time">0.0s</div>
      </div>
    </div>
    <div class="job-track"><i id="job-bar"></i></div>
    <div class="job-sub"><span id="job-sub-l">No job yet. Press Run job.</span><span id="job-sub-r"></span></div>
  </div>

  <!-- actions -->
  <div class="panel" id="p-actions">
    <span class="target-chip">TARGET <b id="target-name">auto</b></span>
    <button class="btn go" id="b-run">▶ Run job</button>
    <button class="btn warn" id="b-pre" title="SIGTERM: 15s drain, then the node exits">⚡ Preempt</button>
    <button class="btn bad" id="b-kill" title="SIGKILL: no warning">💥 Crash</button>
    <button class="btn" id="b-reset">↺ Reset</button>
  </div>

  <div class="panel" id="p-side" title="Event log">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9c9d6" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/></svg>
  </div>

  <div class="panel" id="p-hint"><span>SCROLL TO PAN</span><span>CTRL+SCROLL TO ZOOM</span><span>CLICK A NODE TO TARGET IT</span></div>

  <div class="panel" id="p-events">
    <div class="lbl">Event log (from the master's durable log)</div>
    <div id="ev-list"></div>
  </div>

  <div class="panel" id="p-stats"><span><b id="s-comp">0</b> COMPONENTS</span><span><b id="s-conn">0</b> CONNECTIONS</span><span><b id="s-time">0.0s</b></span></div>
  <div class="panel" id="p-zoom"><button id="z-out">−</button><span id="zoom-pct">100%</span><button id="z-in">+</button><button id="z-fit" title="Fit to screen">⛶</button></div>
  <div id="toast"></div>
</div>

<script>
(() => {
'use strict';

/* ───────────────────────── layout (world units) ───────────────────────── */
const W = { w: 240, h: 108 };
const workerY = i => 96 + i * 120 + (i >= 3 ? 34 : 0);       // 3 active + 2 spares
const redY = j => 130 + j * 120;
const rssRowCenter = j => 150 + 70 + j * 58 + 29;

const ICON = {
  file:   '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  server: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></svg>',
  cpu:    '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>',
  layers: '<svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5z"/><path d="m3 13 9 5 9-5"/><path d="m3 17.5 9 5 9-5" opacity=".5"/></svg>',
  db:     '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>',
  merge:  '<svg viewBox="0 0 24 24"><path d="M6 3v5a4 4 0 0 0 4 4h4a4 4 0 0 1 4 4v5"/><path d="M6 21v-5"/><path d="m15 18 3 3 3-3"/></svg>',
  check:  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
};

const spark = id => `<svg class="spark" viewBox="0 0 84 22" preserveAspectRatio="none"><polyline id="${id}" points="0,21 84,21"/></svg>`;

function nodeShell(id, cls, x, y, w, h, icon, title, tagId, tagTxt, body, pick) {
  return `<div class="node ${cls}${pick ? ' pickable' : ''}" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
    <div class="n-head">${ICON[icon]}<span class="n-title">${title}</span><span class="n-tag" id="${tagId}">${tagTxt}</span></div>
    <div class="n-body" style="padding:0">${body}</div></div>`;
}

const world = document.getElementById('world');
const parts = [];

/* Input */
parts.push(nodeShell('n-input', 'c-purple', 40, 170, 230, 96, 'file', 'Input file', 'in-tag', 'LAPTOP DISK',
  `<div style="padding:8px 11px 9px"><div class="m-row"><div><span class="m-big" id="in-big">–</span><span class="m-lbl" id="in-lbl">NO JOB</span></div></div>
   <div class="m-sub"><span id="in-sub">/data/input</span><span class="rt" id="in-rt"></span></div></div>`));

/* Orchestrator */
parts.push(nodeShell('n-orch', 'c-gray', 40, 470, 230, 130, 'server', 'Orchestrator', 'or-tag', 'MASTER',
  `<div style="padding:8px 11px 9px"><div class="m-sub" style="margin:0 0 2px"><span>FastAPI · scheduler · SQLite</span></div>
   <div class="stat4">
     <div><b id="or-q">0</b><span>QUEUED</span></div><div><b id="or-r">0</b><span>RUNNING</span></div>
     <div><b id="or-d">0</b><span>DONE</span></div><div><b id="or-x">0</b><span>RETRIES</span></div></div>
   <div class="m-sub" style="margin-top:7px"><span id="or-sub">idle</span></div></div>`));

/* Workers */
for (let i = 0; i < 5; i++) {
  parts.push(nodeShell(`n-w${i}`, 'c-blue st-idle', 380, workerY(i), W.w, W.h, 'cpu', `Node ${i + 1}`, `w${i}-tag`, i < 3 ? 'MAPPER' : 'SPARE',
    `<div style="padding:7px 11px 8px">
       <div class="m-row"><div><span class="m-big" id="w${i}-big">0%</span><span class="m-lbl" id="w${i}-lbl">IDLE</span></div>${spark(`w${i}-sp`)}</div>
       <div class="m-sub"><span id="w${i}-sub">waiting for a task</span><span class="rt" id="w${i}-rt">0 KB/s</span></div>
       <div class="bar" id="w${i}-barwrap"><i id="w${i}-bar"></i></div>
       <span class="resume-badge" id="w${i}-res"></span>
     </div>`, true));
}

/* RSS */
let rssBody = `<div style="padding:7px 11px 8px;height:70px"><div class="m-sub" style="margin:0"><span>Remote Shuffle Service :8001</span></div>
  <div class="m-row" style="margin-top:3px"><div><span class="m-big" id="rss-total">0</span><span class="m-lbl">RECORDS</span></div>
  <span class="n-tag t-cyan" style="font-size:8.5px">OFF-NODE · SURVIVES EVICTION</span></div></div>`;
for (let j = 0; j < 3; j++) rssBody += `<div class="row" style="height:58px"><div class="l"><b>P${j}</b><small>hash(word) % 3 == ${j}</small></div>
  <div class="r"><span id="rss-rec${j}">0</span> rec<small id="rss-ch${j}">0 chunks</small></div><div class="bar"><i id="rss-bar${j}"></i></div></div>`;
parts.push(nodeShell('n-rss', 'c-cyan', 760, 150, 270, 70 + 3 * 58 + 38, 'layers', 'Shuffle', 'rss-tag', 'RSS', rssBody));

/* Redis */
let rbody = `<div style="padding:7px 11px 6px;height:44px"><div class="m-sub" style="margin:0"><span>Redis 7.2 · atomic Lua CAS</span><span class="rt" id="rd-n">0 keys</span></div></div>`;
for (let k = 0; k < 3; k++) rbody += `<div class="row" id="rd-row${k}" style="height:34px;visibility:hidden"><div class="l"><b id="rd-t${k}">map-0</b></div>

    setTxt('out-sub2', out.is_success ? '_SUCCESS marker present ✓' : 'part files appearing…');
    $('out-tag').className = 'n-tag ' + (out.is_success ? 't-ok' : 't-blue'); setTxt('out-tag', out.is_success ? 'VERIFIED' : 'LAPTOP DISK');
  } else { setTxt('out-big', '–'); setTxt('out-lbl', 'NO OUTPUT'); setTxt('out-sub', '/data/output'); setTxt('out-sub2', ''); setTxt('out-tag', 'LAPTOP DISK'); $('out-tag').className = 'n-tag'; }

  /* lease watchdog line lights up while something is dead */
  E['lease'].fl.classList.toggle('on', wDown.length > 0);

  /* job panel */
  const expected = mapT.length + (job ? (job.num_reducers || 3) : 0);
  const sum = tasks.reduce((a, t) => a + taskProgress(t), 0);
  const pctJob = job ? (job.state === 'COMPLETED' ? 100 : Math.min(99, Math.round((sum / Math.max(1, expected)) * 100))) : 0;
  setTxt('job-pct', pctJob + '%'); $('job-bar').style.width = pctJob + '%';
  const st = job ? job.state : 'IDLE'; const se = $('job-state'); se.textContent = st;
  se.className = 'job-state ' + (st === 'COMPLETED' ? 'done' : st === 'FAILED' ? 'failed' : st === 'IDLE' ? '' : 'running');
  const t0 = job ? parseTs(job.started_at || job.submitted_at) : 0, t1 = job && job.completed_at ? parseTs(job.completed_at) : now;
  const el = job && t0 ? ((t1 - t0) / 1000).toFixed(1) + 's' : '0.0s'; setTxt('job-time', el); setTxt('s-time', el);
  setTxt('job-sub-l', job ? `${job.name || job.job_id}` : 'No job yet. Press Run job.');
  setTxt('job-sub-r', job ? `${m.tasks_completed || 0}/${m.tasks_total || 0} tasks · ${m.total_retries || 0} retries` : '');

  /* fault note under the workers */
  const f0 = faults[0]; const note = $('note-fault');
  const kill = f0 && f0.cause === 'CRASH_LEASE_EXPIRED';
  note.textContent = f0
    ? (kill ? `A node was hard-killed. Task ${f0.task_id} went back to the queue and a spare resumed it at ${fmtKB(f0.resumed_offset)}, keeping ${f0.work_preserved_pct}% of the work.`
            : `A node was preempted and drained. Task ${f0.task_id} resumed on a spare at ${fmtKB(f0.resumed_offset)} with ${f0.work_preserved_pct}% of the work kept.`)
    : 'Click a node, then Preempt or Crash. A spare picks up its task from the last Redis checkpoint.';

  /* event log */
  const evs = (state.events || []).slice(0, 25);
  $('ev-list').innerHTML = evs.map(e => {
    const k = e.kind; const c = /FAIL|EXPIRED|HARD/.test(k) ? 'k-bad' : /WARN|TERMINATED|DRAIN|AUTOSCALER/.test(k) ? 'k-warn' : /ONLINE|COMPLETED|SUCCESS/.test(k) ? 'k-ok' : '';
    const d = new Date(parseTs(e.ts)); const hh = [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');
    const msg = String(e.message || '').replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
    return `<div class="ev ${c}"><time>${hh}</time><div><em>${k}</em>${msg}</div></div>`;
  }).join('');
}

async function poll() {
  try { const r = await fetch('/dashboard/state'); if (r.ok) render(await r.json()); } catch (e) { /* orchestrator restarting */ }
}
poll(); setInterval(poll, 1000);
})();
</script>
</body>
